# NOTE to self - `man tmux` for all configuration options

# remap prefix to Control + a
set -g prefix C-a
unbind C-b
# send C-a to program in tmux by pressing it twice
bind C-a send-prefix

# enable vi keys
setw -g mode-keys vi

# pass focus-events from tmux to vim https://vi.stackexchange.com/a/18537
set -g focus-events on

# copy paste configuration
# press prefix [ to enter copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Reload the file with Prefix r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# mouse support
set -g mouse on

# Set default terminal for color display
set-option -g default-terminal "tmux-256color"
# Enable 24-bit truecolor passthrough — Ghostty is truecolor, but without this
# tmux quantizes hex colors (Claude Code's UI, bat, etc.) to the 256-color cube.
set-option -ga terminal-features ",*:RGB"

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

######################
### DESIGN CHANGES ###
######################
# Colors use ANSI palette slots (colour0-15) instead of hex, so the bar follows
# the terminal theme (Catppuccin) and auto-switches light<->dark.
#   colour4=blue  colour5=pink/magenta  colour8=dim gray  colour12=bright blue  colour15=bright fg

# pane border
set -g pane-border-style fg='colour8'
set -g pane-active-border-style fg='colour12'

# Command prompt / messages (prefix :, rename-window, etc.). `reverse` paints
# the text in the terminal's background color, so it stays readable in light and
# dark — same trick as the active-window pill. Insert = blue, vi command = pink.
set -g message-style fg='colour4',bg='default',reverse
set -g message-command-style fg='colour5',bg='default',reverse

# set terminal title to hostname + session name
set -g set-titles on
set -g set-titles-string '#{host_short}: #S'

# status line
set -g status-style bg='default'
set -g status-interval 1
# status left
# are we controlling tmux or the content of the panes?
set -g status-left '#{?client_prefix,#[bg=colour5],}'
# are we zoomed into a pane?
set -ga status-left '#[bg=default,fg=colour5] #{?window_zoomed_flag, Z ,}'
# clear status right (default shows hostname, date, time)
set -g status-right ''

# window status
set -g status-justify left
set -g window-status-format "#[fg=colour8,bg=default] #I #W "
# Active window = rounded accent pill (U+E0B6 / U+E0B4 Nerd Font caps, supplied
# by Ghostty). The label uses `reverse` so its text is painted in the terminal's
# BACKGROUND color — always the opposite lightness of the accent — so it stays
# readable in both light (dark-blue pill) and dark (pastel-blue pill).
set -g window-status-current-format "#[fg=colour4,bg=default]#[fg=colour4,bg=default,reverse] #I #W #[fg=colour4,bg=default,noreverse]"

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# new windows open in current path
bind c new-window -c "#{pane_current_path}"

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# fuzzy find (fzf) sessions
unbind-key s
bind-key s neww 'tmux ls | ~/.fzf/bin/fzf | cut -d: -f1 | xargs -I{} tmux switch-client -t {}'
unbind-key f
bind-key f run -b ftwind # fzf fuzzy find windows https://github.com/junegunn/fzf/wiki/examples

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# prevent windows from renaming themselves
set-option -g allow-rename off

# renumber windows as they open/close
set-option -g renumber-windows on

# make copy paste more like vim
# See: goo.gl/2Bfn8
unbind [
bind Escape copy-mode

# increase scroll-back history
set -g history-limit 50000

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# OSC 52 clipboard support (for Ghostty terminal)
set -g set-clipboard on
set -g allow-passthrough on

# pass through modified keys (Shift/Alt-Enter etc.) to apps like pi
set -g extended-keys on
# csi-u format disambiguates modifiers (pi warns if left as xterm)
set -g extended-keys-format csi-u

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
